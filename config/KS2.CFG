vmaccepteula

#Using USB Key as install and boot device
install --disk=mpx.vmhba32:C0:T0:L0 --overwritevmfs
reboot

network --bootproto=static --vlanid=300 --ip=172.30.0.11 --netmask=255.255.255.0 --gateway=172.30.0.253 --hostname=vcf9-esx02.abidi.systems --nameserver=192.168.1.100 --addvmportgroup=1

rootpw VMware1!

%firstboot --interpreter=busybox

# Enter Maintenance Mode
esxcli system maintenanceMode set -e true

#!/bin/ash
# Author: William Lam
# Contributor: Abbed Sedkaoui

# Enable NVME tiering and the device UID if you have an additional dedicated/recognized high endurance NVME disk returned by `vdq -q`, not required with VCF Automation removed from the provided json 
ENABLE_NVME_TIERING="false"
NVME_TIERING_DEVICE=""

# SSD Device Name (as shown in vdq -q) Fanxiang S790 2TB
SSD_DEVICE="t10.NVMe____Fanxiang_S880_2TB_______________________1100535202D5820C"

# Sparing 10% at the end of the SSD Local Datastore Disk for NVMe Controller garbarge collection likely extend the SSD life
SSD_SIZE_MINUS_10PCT="true"

# Size in GB for ESXi OSData
OSDATA_SIZE_IN_GB=32

# Name for VMFS datastore
VMFS_DATASTORE_NAME="local-vmfs-datastore-2"

# Using w32tm Windows service in active directory, be sure to run the 2 commands before starting the deployment
NTP_SERVER=192.168.1.100
SSH_ROOT_KEY=""
MANAGEMENT_VLAN=300
MANAGEMENT_VSWITCH_MTU=1700

# Use MTU 9000 for MANAGEMENT VSWITCH and NFS if your physical switch support it at Interface Vlan level, my switch only supporte 1500-2000 at Interface Vlan level

# NSX Edge workaround for non-EPYC systems
echo 'cpuid.brandstring = "AMD EPYC Ryzen 9 3900 12-Core Processor"' >> /etc/vmware/config

# Ensure hostd is ready
while ! vim-cmd hostsvc/runtimeinfo; do
sleep 10
done

# enable & start SSH
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# enable & start ESXi Shell
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Suppress ESXi Shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Configure NTP
esxcli system ntp set -e true -s $NTP_SERVER
/sbin/chkconfig ntpd on

# Disable LRO/TSO (especially for Intel 710 nics)
esxcli system settings advanced set -o /Net/TcpipDefLROEnabled -i 0
esxcli system settings advanced set -o /Net/UseHwTSO -i 0

# Use older vSAN ESA compression algorithim
esxcli system settings advanced set -o /VSAN/Vsan2ZdomCompZstd -i 0

/bin/generate-certificates

# Enable Core Dump
esxcli system coredump file set -s -e true

# Configure SSH keys if provided
if [ -n "${SSH_ROOT_KEY}" ]; then
    echo "${SSH_ROOT_KEY}" > /etc/ssh/keys-root/authorized_keys
fi
# Configure VM Network VLAN & MTU
esxcli network vswitch standard portgroup set -p "VM Network" -v ${MANAGEMENT_VLAN}
esxcli network vswitch standard set -m ${MANAGEMENT_VSWITCH_MTU} -v vSwitch0
esxcli network ip interface set -i vmk0 -m 1500

OSDATA_GUID="4EB2EA3978554790A79EFAE495E21F8D"
VMFS_GUID="AA31E02A400F11DB9590000C2911D1B8"

GREEN="\e[32m"
CYAN="\e[36m"
ENDCOLOR="\e[0m"

# Sector size in bytes
sector_size=512

# Start & End Sector for ESXi OSData partition
osdata_partition_size_bytes=$(( (OSDATA_SIZE_IN_GB * 1024 * 1024 * 1024 / sector_size ) - 1 ))
nvme_start_sector=2048
osdata_start_sector=$(( nvme_start_sector + 1 ))
osdata_end_sector=$(( nvme_start_sector + osdata_partition_size_bytes ))

# Start & End Sector for VMFS partition
vmfs_start_sector=$(( osdata_end_sector + 2048 + 1 ))
total_disk_capacity_bytes=$(partedUtil getUsableSectors /vmfs/devices/disks/${SSD_DEVICE} | awk '{print $2}')
total_disk_capacity_bytes_minus_10pct=$(( (total_disk_capacity_bytes * 90 / 100) ))

# Construct partedUtil command
partedUtilCommand="partedUtil setptbl /vmfs/devices/disks/${SSD_DEVICE} gpt"

partition1="1 ${osdata_start_sector} ${osdata_end_sector} ${OSDATA_GUID} 0"
if [ "$SSD_SIZE_MINUS_10PCT" = "true" ]; then
    partition2="2 ${vmfs_start_sector} ${total_disk_capacity_bytes_minus_10pct} ${VMFS_GUID} 0"
else
    partition2="2 ${vmfs_start_sector} ${total_disk_capacity_bytes} ${VMFS_GUID} 0"
fi

echo -e "\n${GREEN}Running partedUtil command first:${ENDCOLOR}"
echo -e "${CYAN}${partedUtilCommand} \"${partition1}\" \"${partition2}\"${ENDCOLOR}"
${partedUtilCommand} "${partition1}" "${partition2}"

generated_uuid=$(python -c "import uuid; print(str(uuid.uuid4()))")
osdata_volume_name="OSDATA-${generated_uuid}"

echo -e "\n${GREEN}Running vmkfstools command second:${ENDCOLOR}"
echo -e "${CYAN}vmkfstools -C vmfs6l --isSystem 1 /vmfs/devices/disks/${SSD_DEVICE}:1 -S ${osdata_volume_name}${ENDCOLOR}"
vmkfstools -C vmfs6l --isSystem 1 /vmfs/devices/disks/${SSD_DEVICE}:1 -S ${osdata_volume_name}

system_generated_uuid=$(esxcli storage filesystem list | grep "${osdata_volume_name}" | awk '{print $3}')
new_osdata_volume_name="OSDATA-${system_generated_uuid}"

echo -e "\n${GREEN}Running ln command third:${ENDCOLOR}"
echo -e "${CYAN}ln -sf /vmfs/volumes/${system_generated_uuid} /vmfs/volumes/${new_osdata_volume_name}${ENDCOLOR}"
ln -sf /vmfs/volumes/${system_generated_uuid} /vmfs/volumes/${new_osdata_volume_name}

echo -e "\n${GREEN}Running vmkfstools command fourth:${ENDCOLOR}"
echo -e "${CYAN}vmkfstools -C vmfs6 /vmfs/devices/disks/${SSD_DEVICE}:2 -S ${VMFS_DATASTORE_NAME}${ENDCOLOR}"
vmkfstools -C vmfs6 /vmfs/devices/disks/${SSD_DEVICE}:2 -S ${VMFS_DATASTORE_NAME}

echo -e "\n${GREEN}Running vim-cmd command fifth:${ENDCOLOR}"
echo -e "${CYAN}vim-cmd hostsvc/advopt/update OSData.configuredLocation string /vmfs/volumes/${system_generated_uuid}${ENDCOLOR}\n"
vim-cmd hostsvc/advopt/update OSData.configuredLocation string /vmfs/volumes/${system_generated_uuid}

# Enable & Configure NVMe Tiering (controlled by flag)
if [ "$ENABLE_NVME_TIERING" = "true" ]; then
    echo "NVMe Tiering is ENABLED"

    version=$(vmware -r)

    if echo "$version" | grep -q "9.0"; then
        echo "Detected 9.0"
        esxcli system settings kernel set -s MemoryTiering -v TRUE
        esxcli system settings advanced set -o /Mem/TierNvmePct -i 100
        esxcli system tierdevice create -d /vmfs/devices/disks/$NVME_TIERING_DEVICE}

    elif echo "$version" | grep -q "9.1"; then
        echo "Detected 9.1"
        esxcli memtier enable -d /vmfs/devices/disks/${NVME_TIERING_DEVICE} -r 100

    else
        echo "Unknown version: $version"
    fi

else
    echo "NVMe Tiering is DISABLED, skipping configuration"
fi

# Exit Maintenance Mode
esxcli system maintenanceMode set -e false

reboot
