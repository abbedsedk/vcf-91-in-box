vmaccepteula
install --disk=t10.NVMe____Fanxiang_S880_2TB_______________________1100535202D5820C --overwritevmfs
reboot

network --bootproto=static --vlanid=300 --ip=172.30.0.11 --netmask=255.255.255.0 --gateway=172.30.0.253 --hostname=vcf9-esx02.abidi.systems --nameserver=192.168.1.100 --addvmportgroup=1
rootpw VMware1!

%firstboot --interpreter=busybox

# Enable NVME tiering and the device UID if you have an additional dedicated/recognized high endurance NVME disk returned by `vdq -q`, not required with VCF Automation removed from the provided json 
ENABLE_NVME_TIERING="false"
NVME_TIERING_DEVICE=""
VMFS_DATASTORE_NAME="local-vmfs-datastore-2"
# Using w32tm Windows service in active directory, be sure to run the 2 commands before starting the deployment
NTP_SERVER=192.168.1.100
SSH_ROOT_KEY=""
MANAGEMENT_VLAN=300
MANAGEMENT_VSWITCH_MTU=1700

# Use MTU 9000 for MANAGEMENT VSWITCH and NFS if your physical switch support it at Interface Vlan level, my switch only supporte 1500-2000 at Interface Vlan level

# Using VLAN 0 (strictly speaking untagged VLAN1 on physical switch) because my NFS is a VM bridged with a single nic system, use a dedicated VLAN for NFS if there is dedicated nic 
NFS_VLAN=0
NFS_MTU=1700
# Do not use IPs from the begining of the pool because VCF Installer validations will use them
NFS_VMK3_IP=192.168.1.153

# NSX Edge workaround for non-EPYC systems
echo 'cpuid.brandstring = "AMD EPYC Ryzen 9 3900 12-Core Processor"' >> /etc/vmware/config

# Configure VM Network VLAN & MTU
esxcli network vswitch standard portgroup set -p "VM Network" -v ${MANAGEMENT_VLAN}
esxcli network vswitch standard set -m ${MANAGEMENT_VSWITCH_MTU} -v vSwitch0
esxcli network ip interface set -i vmk0 -m 1500

# Configure NFS VMKernel Portgroup and interface
esxcli network vswitch standard portgroup add -v vSwitch0 -p NFS-VMKernel-PG
esxcli network vswitch standard portgroup set -p NFS-VMKernel-PG -v ${NFS_VLAN}
esxcli network ip interface add -i vmk3 -m ${NFS_MTU} -p NFS-VMKernel-PG
esxcli network ip interface ipv4 set -i vmk3 -I ${NFS_VMK3_IP} -N 255.255.255.0 -t static
esxcfg-advcfg -s 8 /NFS/MaxConnectionsPerDatastore

# Ensure hostd is ready
while ! vim-cmd hostsvc/runtimeinfo; do
sleep 10
done

# Enter Maintenance Mode
esxcli system maintenanceMode set -e true

# enable & start SSH
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh

# enable & start ESXi Shell
vim-cmd hostsvc/enable_esx_shell
vim-cmd hostsvc/start_esx_shell

# Suppress ESXi Shell warning
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Configure NTP
esxcli system ntp set -e true -s $NTP_SERVER
/sbin/chkconfig ntpd on

# Rename local VMFS datastore
vim-cmd hostsvc/datastore/rename datastore1 ${VMFS_DATASTORE_NAME}

# Enable & Configure NVMe Tiering (controlled by flag)
if [ "$ENABLE_NVME_TIERING" = "true" ]; then
    echo "NVMe Tiering is ENABLED"

    version=$(vmware -r)

    if echo "$version" | grep -q "9.0"; then
        echo "Detected 9.0"
        esxcli system settings kernel set -s MemoryTiering -v TRUE
        esxcli system settings advanced set -o /Mem/TierNvmePct -i 100
        esxcli system tierdevice create -d /vmfs/devices/disks/${NVME_TIERING_DEVICE}

    elif echo "$version" | grep -q "9.1"; then
        echo "Detected 9.1"
        esxcli memtier enable -d /vmfs/devices/disks/${NVME_TIERING_DEVICE} -r 100

    else
        echo "Unknown version: $version"
    fi

else
    echo "NVMe Tiering is DISABLED, skipping configuration"
fi

# Disable LRO/TSO (especially for Intel 710 nics)
esxcli system settings advanced set -o /Net/TcpipDefLROEnabled -i 0
esxcli system settings advanced set -o /Net/UseHwTSO -i 0

# Use older vSAN ESA compression algorithim
esxcli system settings advanced set -o /VSAN/Vsan2ZdomCompZstd -i 0

/bin/generate-certificates

# Enable Core Dump
esxcli system coredump file set -s -e true

# Configure SSH keys if provided
if [ -n "${SSH_ROOT_KEY}" ]; then
    echo "${SSH_ROOT_KEY}" > /etc/ssh/keys-root/authorized_keys
fi

# Exit Maintenance Mode
esxcli system maintenanceMode set -e false

reboot
